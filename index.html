<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LATM: Hive Infiltration</title>
<meta name="description" content="A free playable episode set in the world of Life After The Machines. Awaken, fight through the hive, reach the core.">
<meta name="theme-color" content="#04060a">
<link rel="icon" href="data:,">
<style>
  :root{
    --fg:#e8eff4; --dim:#7f8d98; --acc:#ff6a2a; --red:#ff3b3b; --warn:#ffd23f; --bg:#04060a;
    --grn:var(--fg); --grn-dim:rgba(232,239,244,.28);
    --font:"Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:var(--font);color:var(--fg);font-weight:500;text-transform:uppercase;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  canvas{display:block;}
  #hud,#overlays{position:fixed;inset:0;pointer-events:none;}

  /* low-tier stand-in for the post stack vignette (hidden when the grade pass runs) */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62) 100%);}
  body.postfx #vig{display:none;}

  /* crosshair: four ticks that open up on fire, center dot */
  #crosshair{position:absolute;left:50%;top:50%;width:0;height:0;display:none;
    --gap:7px;--len:8px;transition:none;}
  #crosshair i{position:absolute;background:rgba(255,255,255,.92);box-shadow:0 0 3px rgba(0,0,0,.8);
    transition:transform .09s ease-out;}
  #crosshair i:nth-child(1){width:2px;height:var(--len);left:-1px;top:calc(-1 * (var(--gap) + var(--len)));}
  #crosshair i:nth-child(2){width:2px;height:var(--len);left:-1px;top:var(--gap);}
  #crosshair i:nth-child(3){height:2px;width:var(--len);top:-1px;left:calc(-1 * (var(--gap) + var(--len)));}
  #crosshair i:nth-child(4){height:2px;width:var(--len);top:-1px;left:var(--gap);}
  #crosshair:after{content:"";position:absolute;left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;
    background:var(--acc);box-shadow:0 0 6px var(--acc);}
  #crosshair.fire{--gap:12px;}
  #crosshair.target i{background:var(--red);}

  /* hit marker */
  #hitmarker{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;}
  #hitmarker:before,#hitmarker:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:26px;
    margin:-13px 0 0 -1px;background:#fff;transform:rotate(45deg);box-shadow:0 0 4px rgba(0,0,0,.9);
    -webkit-mask:linear-gradient(#000 0 32%,transparent 32% 68%,#000 68%);mask:linear-gradient(#000 0 32%,transparent 32% 68%,#000 68%);}
  #hitmarker:after{transform:rotate(-45deg);}
  #hitmarker.show{animation:hm .18s ease-out;}
  #hitmarker.kill:before,#hitmarker.kill:after{background:var(--red);}
  @keyframes hm{0%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.85)}}

  /* health ring (top left) */
  #healthWrap{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));
    width:150px;height:56px;display:none;}
  #healthWrap svg{position:absolute;left:0;top:0;width:56px;height:56px;transform:rotate(-90deg);}
  #healthWrap circle{fill:none;stroke-width:3;}
  #healthWrap .trk{stroke:rgba(232,239,244,.16);}
  #healthFill{stroke:var(--fg);stroke-linecap:butt;stroke-dasharray:138.2;stroke-dashoffset:0;
    filter:drop-shadow(0 0 3px rgba(255,255,255,.35));transition:stroke-dashoffset .12s linear;}
  #healthWrap.low #healthFill{stroke:var(--red);filter:drop-shadow(0 0 5px var(--red));}
  #healthWrap.low{animation:lowpulse .8s infinite;}
  @keyframes lowpulse{0%,100%{opacity:1}50%{opacity:.55}}
  #healthNum{position:absolute;left:0;top:0;width:56px;height:56px;line-height:56px;text-align:center;
    font-size:17px;letter-spacing:1px;font-weight:700;}
  #healthLabel{position:absolute;left:66px;top:14px;font-size:10px;letter-spacing:3px;color:var(--dim);}
  #healthLabel:after{content:"";display:block;width:34px;height:2px;margin-top:5px;background:var(--acc);}

  /* weapon readout (top right): heat arc + infinite cell */
  #ammoWrap{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));
    width:150px;height:56px;display:none;text-align:right;}
  #ammoWrap svg{position:absolute;right:0;top:0;width:56px;height:56px;transform:rotate(-90deg) scaleY(-1);}
  #ammoWrap circle{fill:none;stroke-width:3;}
  #ammoWrap .trk{stroke:rgba(232,239,244,.16);}
  #heatFill{stroke:var(--acc);stroke-dasharray:138.2;stroke-dashoffset:138.2;filter:drop-shadow(0 0 4px var(--acc));}
  #ammoInf{position:absolute;right:0;top:0;width:56px;height:56px;line-height:56px;text-align:center;font-size:24px;}
  #ammoName{position:absolute;right:66px;top:14px;white-space:nowrap;font-size:10px;letter-spacing:3px;color:var(--dim);}
  #ammoName:after{content:"";display:block;width:34px;height:2px;margin:5px 0 0 auto;background:var(--acc);}

  /* objective */
  #objective{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:4px;text-align:center;display:none;max-width:44vw;
    text-shadow:0 1px 6px rgba(0,0,0,.9);color:var(--fg);}
  #objective:before{content:"";display:inline-block;width:7px;height:7px;background:var(--acc);
    transform:rotate(45deg);margin-right:10px;vertical-align:1px;box-shadow:0 0 8px var(--acc);}

  @media (max-width:640px){
    #healthLabel,#ammoName{display:none;}
    #healthWrap,#ammoWrap{width:56px;}
    #objective{top:max(76px,calc(env(safe-area-inset-top) + 68px));max-width:78vw;font-size:11px;letter-spacing:3px;}
  }
  /* radio feed */
  #radio{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:104px;max-width:min(560px,74%);font-size:14px;
    line-height:1.35;letter-spacing:.8px;text-transform:none;font-weight:500;}
  .radioLine{opacity:0;transition:opacity .3s;margin-top:6px;padding:5px 12px 6px;
    border-left:2px solid var(--acc);background:linear-gradient(90deg,rgba(4,6,10,.72),rgba(4,6,10,0));
    text-shadow:0 1px 4px rgba(0,0,0,.9);}
  .radioLine .who{color:var(--acc);font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase;}
  .radioLine.show{opacity:1;}

  /* center prompt */
  #prompt{position:absolute;left:50%;bottom:27%;transform:translateX(-50%);
    font-size:13px;letter-spacing:3px;padding:9px 18px;border:1px solid var(--grn-dim);border-left:3px solid var(--acc);
    background:rgba(4,6,10,.62);display:none;text-align:center;animation:pulse 1.4s infinite;white-space:nowrap;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

  /* plant progress */
  #plantWrap{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:240px;display:none;}
  #plantLabel{font-size:11px;letter-spacing:4px;text-align:center;margin-bottom:6px;}
  #plantBar{height:3px;background:rgba(232,239,244,.18);}
  #plantFill{height:100%;width:0%;background:var(--acc);box-shadow:0 0 10px var(--acc);}

  /* damage feedback */
  #dmgVignette{position:absolute;inset:0;opacity:0;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(220,10,20,.62) 100%);
    transition:opacity .22s;}
  #dmgDir{position:absolute;left:50%;top:50%;width:min(60vw,60vh);height:min(60vw,60vh);opacity:0;
    transform:translate(-50%,-50%);transition:opacity .5s;}
  #dmgDir:before{content:"";position:absolute;left:0;right:0;top:0;height:30%;
    background:radial-gradient(ellipse 34% 60% at 50% 0%,rgba(255,40,30,.95),rgba(255,40,30,0) 100%);}
  #fade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 1s;}
  #redFade{position:absolute;inset:0;background:#2a0006;opacity:0;transition:opacity .8s;}

  /* touch controls */
  #stickZone,#lookZone{position:absolute;top:0;bottom:0;pointer-events:auto;display:none;}
  #stickZone{left:0;width:45%;}
  #lookZone{right:0;width:55%;}
  #stickBase{position:absolute;width:116px;height:116px;border:1.5px solid rgba(232,239,244,.38);
    border-radius:50%;display:none;transform:translate(-50%,-50%);background:rgba(4,6,10,.22);}
  #stickNub{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;
    background:rgba(232,239,244,.2);border:1.5px solid var(--fg);transform:translate(-50%,-50%);}
  #fireBtn{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;
    border:1.5px solid rgba(232,239,244,.55);background:rgba(4,6,10,.38);color:var(--fg);
    font-family:inherit;font-size:11px;letter-spacing:3px;display:none;pointer-events:auto;font-weight:700;}
  #fireBtn:after{content:"";position:absolute;inset:26px;border:2px solid var(--acc);border-radius:50%;opacity:.9;}
  #fireBtn:active{background:rgba(255,106,42,.28);border-color:var(--acc);}
  #plantBtn{position:absolute;right:max(30px,env(safe-area-inset-right));bottom:150px;width:78px;height:78px;border-radius:50%;
    border:1.5px solid var(--warn);background:rgba(4,6,10,.45);color:var(--warn);
    font-family:inherit;font-size:11px;letter-spacing:2px;display:none;pointer-events:auto;font-weight:700;}

  /* screens */
  .screen{position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 115%,rgba(255,106,42,.16),transparent 58%),
      linear-gradient(180deg,#05070b 0%,#0a0d12 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:auto;padding:24px;}
  .screen:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);}
  .screen h1{font-size:clamp(26px,6.2vw,54px);letter-spacing:.28em;font-weight:700;
    text-shadow:0 0 26px rgba(255,106,42,.35);line-height:1.1;}
  .screen h1:after{content:"";display:block;width:64px;height:3px;margin:18px auto 0;background:var(--acc);box-shadow:0 0 12px var(--acc);}
  .screen h2{font-size:clamp(12px,2.6vw,16px);letter-spacing:.34em;color:var(--dim);margin-top:16px;font-weight:500;}
  .btn{margin-top:30px;padding:14px 38px;border:1px solid rgba(232,239,244,.5);background:rgba(232,239,244,.04);
    color:var(--fg);font-family:inherit;font-size:14px;letter-spacing:.3em;cursor:pointer;font-weight:700;
    text-decoration:none;display:inline-block;text-transform:uppercase;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
  .btn:hover{background:rgba(255,106,42,.18);border-color:var(--acc);}
  .btn.amber{border-color:var(--acc);color:var(--acc);background:rgba(255,106,42,.08);}
  .btn.small{font-size:11px;padding:9px 18px;margin-top:12px;opacity:.85;}
  #startHint{margin-top:26px;font-size:11px;letter-spacing:.24em;color:var(--dim);line-height:1.9;}

  /* intro */
  #intro{background:#000;display:none;}
  #introText{font-size:clamp(15px,3.4vw,22px);letter-spacing:.14em;line-height:1.9;
    max-width:640px;min-height:4em;opacity:0;transition:opacity 1.2s;color:#dfe8ee;text-transform:none;
    text-shadow:0 2px 12px rgba(0,0,0,.9);}
  #skipBtn{position:absolute;right:18px;bottom:18px;padding:8px 16px;border:1px solid var(--grn-dim);
    background:transparent;color:var(--fg);font-family:inherit;font-size:11px;letter-spacing:.24em;
    cursor:pointer;opacity:0;transition:opacity .6s;}

  /* end card */
  #endCard{display:none;background:radial-gradient(ellipse at center,#12100e 0%,#030405 75%);}
  #endTitle{font-size:clamp(18px,4.4vw,30px);letter-spacing:.24em;margin-bottom:26px;font-weight:700;
    text-shadow:0 0 18px rgba(255,106,42,.35);}
  #cover{width:min(200px,44vw);aspect-ratio:5/8;border:1px solid rgba(232,239,244,.5);
    background:linear-gradient(160deg,#10151a 0%,#05070a 60%,#10151a 100%);
    box-shadow:0 10px 50px rgba(0,0,0,.8), 0 0 40px rgba(255,106,42,.18);
    position:relative;overflow:hidden;margin:0 auto;}
  #coverImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #coverFallback{position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:space-between;padding:16px 12px;}
  #cover .cTop{font-size:9px;letter-spacing:.3em;opacity:.7;}
  #cover .cTitle{font-size:clamp(13px,3vw,17px);letter-spacing:.18em;line-height:1.6;}
  #cover .cGlyph{font-size:34px;opacity:.9;color:var(--acc);}
  #cover .cBottom{font-size:9px;letter-spacing:.3em;opacity:.7;}
  #endSub{margin-top:22px;font-size:13px;letter-spacing:.14em;color:#b9c4cc;max-width:520px;line-height:1.8;text-transform:none;}
  #endBtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
</style>
</head>
<body>

<div id="vig"></div>
<div id="hud">
  <div id="crosshair"><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"></div>
  <div id="dmgDir"></div>
  <div id="healthWrap">
    <svg viewBox="0 0 56 56"><circle class="trk" cx="28" cy="28" r="22"></circle><circle id="healthFill" cx="28" cy="28" r="22"></circle></svg>
    <div id="healthNum">100</div>
    <div id="healthLabel">VITALS</div>
  </div>
  <div id="ammoWrap">
    <svg viewBox="0 0 56 56"><circle class="trk" cx="28" cy="28" r="22"></circle><circle id="heatFill" cx="28" cy="28" r="22"></circle></svg>
    <div id="ammoInf">&#8734;</div>
    <div id="ammoName">PULSE RIFLE</div>
  </div>
  <div id="objective"></div>
  <div id="radio"></div>
  <div id="prompt"></div>
  <div id="plantWrap">
    <div id="plantLabel">ARMING CHARGE</div>
    <div id="plantBar"><div id="plantFill"></div></div>
  </div>
  <div id="dmgVignette"></div>
</div>

<div id="stickZone"></div>
<div id="lookZone"></div>
<div id="stickBase"><div id="stickNub"></div></div>
<button id="fireBtn">FIRE</button>
<button id="plantBtn">PLANT</button>

<div id="overlays">
  <div id="redFade"></div>
  <div id="fade"></div>

  <div class="screen" id="startScreen">
    <h1>HIVE INFILTRATION</h1>
    <h2>A LIFE AFTER THE MACHINES EPISODE</h2>
    <button class="btn" id="startBtn">TAP TO BEGIN</button>
    <div id="startHint"></div>
  </div>

  <div class="screen" id="intro">
    <div id="introText"></div>
    <button id="skipBtn">SKIP &#9656;</button>
  </div>

  <div class="screen" id="endCard">
    <div id="endTitle">MARCUS'S STORY CONTINUES.</div>
    <div id="cover">
      <div id="coverFallback">
        <div class="cTop">A NOVEL</div>
        <div class="cTitle">LIFE<br>AFTER THE<br>MACHINES</div>
        <div class="cGlyph">&#10683;</div>
        <div class="cBottom">BOOK ONE</div>
      </div>
      <img id="coverImg" alt="Dystopia: Life After The Machines, Book One cover"
           onload="if(this.naturalWidth<50){this.remove()}else{this.style.display='block';document.getElementById('coverFallback').style.display='none'}"
           onerror="this.remove()">
    </div>
    <div id="endSub">The hive was only the beginning. Find out how Marcus's war really started , and where it goes from here.</div>
    <div id="endBtns" style="margin-top:26px;">
      <a class="btn amber" id="book1Btn" target="_blank" rel="noopener">READ BOOK 1</a>
      <button class="btn" id="replayBtn">REPLAY</button>
    </div>
  </div>
</div>

/* ============================================================
   Quality system: auto-detects a tier, never trusts it blindly.
   low  = phones / weak GPUs: direct render, no shadows, capped pixel ratio
   med  = bloom + color grade post stack, no shadows
   high = med + shadow-casting flashlight, FXAA, higher pixel ratio, more particles
   Override: ?q=low|med|high  (or the GFX button on the title screen).
   A runtime governor steps DOWN when frame rate is poor and steps UP once
   on a phone that is clearly coasting. Choice is remembered per device.
   ============================================================ */
const QP = {
  low:  { pr:1.15, shadows:0, post:0, bloom:0,   fxaa:0, dust:80,  accent:0, shafts:4,  decals:10, tex:256 },
  med:  { pr:1.35, shadows:0, post:1, bloom:.45, fxaa:0, dust:170, accent:1, shafts:8,  decals:18, tex:512 },
  high: { pr:1.75, shadows:1, post:1, bloom:.6,  fxaa:1, dust:320, accent:1, shafts:14, decals:28, tex:512 },
};
const QLEVELS = ['low','med','high'];
const Q = (() => {
  const url = new URLSearchParams(location.search).get('q');
  let saved = null; try { saved = localStorage.getItem('latm_q'); } catch(e){}
  const coarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
  const smallScreen = Math.min(screen.width, screen.height) < 700;
  const mem = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4;
  let auto = 'high';
  if ((IS_TOUCH && (coarse || smallScreen)) || mem <= 2 || cores <= 2) auto = 'low';
  else if (mem <= 4 || cores <= 4) auto = 'med';
  let cap = null; try { cap = localStorage.getItem('latm_qcap'); } catch(e){}
  if (QLEVELS.includes(cap) && QLEVELS.indexOf(cap) < QLEVELS.indexOf(auto)) auto = cap;
  const pick = [url, saved].find(v => QLEVELS.includes(v));
  const level = pick || auto;
  return { level, auto, forced: !!pick, userChoice: pick || 'auto', p: QP[level], scale: 1,
           noUp: !!pick, phone: auto === 'low' && IS_TOUCH };
})();
const TEXN = Q.p.tex;
{
  // title-screen graphics selector: AUTO / LOW / MED / HIGH (remembered on this device)
  const gb = document.createElement('button');
  gb.className = 'btn small'; gb.id = 'gfxBtn';
  gb.onclick = () => {
    const order = ['auto','low','med','high'];
    const next = order[(order.indexOf(Q.userChoice) + 1) % order.length];
    Q.userChoice = next; Q.noUp = next !== 'auto'; Q.scale = 1;
    try { if (next === 'auto'){ localStorage.removeItem('latm_q'); localStorage.removeItem('latm_qcap'); } else localStorage.setItem('latm_q', next); } catch(e){}
    applyQuality(next === 'auto' ? Q.auto : next);
  };
  document.getElementById('startScreen').appendChild(gb);
}

}

/* ============================================================
   Audio, all synthesized, zero assets
   ============================================================ */
const AudioSys = (() => {
  let ctx = null, master = null, humOsc = null, humGain = null, alarmTimer = null, heartTimer = null;
  function init(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
  }
  function now(){ return ctx.currentTime; }
  function env(g, t0, a, peak, d){
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function tone(type, f0, f1, dur, peak, t0){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0 + dur);
    env(g, t0, 0.005, peak, dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, peak, t0, freq, q){
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=freq; flt.Q.value=q;
    const g = ctx.createGain(); env(g, t0, 0.003, peak, dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }
  return {
    init,
    getCtx(){ init(); return ctx; },
    resume(){ if (ctx && ctx.state === 'suspended') ctx.resume(); },
    heartbeatStart(){
      init(); if (heartTimer) return;
      const thump = () => {
        const t = now();
        tone('sine', 62, 38, 0.16, 0.9, t);
        tone('sine', 55, 34, 0.13, 0.6, t + 0.28);
      };
      thump(); heartTimer = setInterval(thump, 1050);
    },
    heartbeatStop(){ if (heartTimer){ clearInterval(heartTimer); heartTimer = null; } },
    humStart(){
      init(); if (humOsc) return;
      humOsc = ctx.createOscillator(); humOsc.type='sawtooth'; humOsc.frequency.value=42;
      const flt = ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=140;
      humGain = ctx.createGain(); humGain.gain.value = 0.05;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.13;
      const lfoG = ctx.createGain(); lfoG.gain.value = 20;
      lfo.connect(lfoG); lfoG.connect(flt.frequency);
      humOsc.connect(flt); flt.connect(humGain); humGain.connect(master);
      humOsc.start(); lfo.start();
    },
    shot(){ if(!ctx)return; const t=now();
      tone('square', 880, 140, 0.09, 0.35, t); noise(0.07, 0.25, t, 2500, 0.8); },
    hitConfirm(){ if(!ctx)return; tone('square', 1600, 1600, 0.04, 0.18, now()); },
    droneDie(){ if(!ctx)return; const t=now();
      tone('sawtooth', 300, 40, 0.35, 0.4, t); noise(0.3, 0.3, t, 700, 0.6); },
    alert(){ if(!ctx)return; const t=now();
      tone('sawtooth', 220, 660, 0.22, 0.3, t); },
    sentryCharge(){ if(!ctx)return; const t=now();
      tone('sine', 300, 1200, 0.6, 0.22, t); },
    sentryFire(){ if(!ctx)return; const t=now();
      tone('sawtooth', 700, 120, 0.18, 0.35, t); noise(0.12, 0.2, t, 1800, 1); },
    hurt(){ if(!ctx)return; const t=now();
      noise(0.18, 0.5, t, 300, 0.5); tone('sine', 120, 60, 0.2, 0.5, t); },
    windStart(){
      init(); if (this._wind) return;
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const flt = ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=460;
      const g = ctx.createGain(); g.gain.value = .05;
      const lfo = ctx.createOscillator(); lfo.frequency.value = .17;
      const lg = ctx.createGain(); lg.gain.value = .02;
      lfo.connect(lg); lg.connect(g.gain);
      src.connect(flt); flt.connect(g); g.connect(master);
      src.start(); lfo.start();
      this._wind = { src, lfo, g };
    },
    windStop(){
      if (!this._wind) return;
      this._wind.g.gain.setTargetAtTime(0.0001, now(), .4);
      const w = this._wind; this._wind = null;
      setTimeout(()=>{ try{ w.src.stop(); w.lfo.stop(); }catch(e){} }, 1500);
    },
    radioBlip(){ if(!ctx)return; const t=now();
      tone('square', 1046, 1046, 0.05, 0.12, t); tone('square', 1568, 1568, 0.05, 0.12, t+0.08); },
    checkpoint(){ if(!ctx)return; const t=now();
      tone('sine', 523, 523, 0.1, 0.25, t); tone('sine', 784, 784, 0.16, 0.25, t+0.11); },
    doorOpen(){ if(!ctx)return; const t=now();
      tone('sawtooth', 90, 55, 0.9, 0.25, t); noise(0.8, 0.12, t, 400, 0.4); },
    plantTick(){ if(!ctx)return; tone('square', 988, 988, 0.03, 0.12, now()); },
    planted(){ if(!ctx)return; const t=now();
      [523,659,784,1046].forEach((f,i)=>tone('sine',f,f,0.14,0.25,t+i*0.09)); },
    alarmStart(){
      init(); if (alarmTimer) return;
      let hi = false;
      alarmTimer = setInterval(()=>{ tone('square', hi?540:404, hi?540:404, 0.28, 0.1, now()); hi=!hi; }, 460);
    },
    alarmStop(){ if (alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; } },
    death(){ if(!ctx)return; const t=now();
      tone('sawtooth', 200, 30, 1.2, 0.4, t); noise(1.0, 0.3, t, 200, 0.4); },
    extract(){ if(!ctx)return; const t=now();
      tone('sine', 220, 880, 1.6, 0.2, t); tone('sine', 330, 1320, 1.6, 0.12, t); },
  };
})();

const MusicSys = (() => {
  let ctx=null, out=null, padGain=null, padFilter=null, arpGain=null, percGain=null,
      delay=null, timer=null, step=0, mode='calm', muted=false, running=false;
  const ROOT = ({ ch1:73.42, ch2:110.0, ch3:82.41 })[CH.id] || 73.42; // D2 / A2 / E2
  const SCALE = [0,3,5,7,10,12,15,19];            // minor pentatonic, two octaves
  const MODES = {
    calm:   { pad:.05,  arp:.05, perc:0,    stepDur:.42, density:.20 },
    combat: { pad:.06,  arp:.07, perc:.05,  stepDur:.30, density:.45 },
    alarm:  { pad:.075, arp:.09, perc:.09,  stepDur:.22, density:.70 },
  };
  let stepDur=.42, density=.2;
  function applyMode(m, hard){
    mode = m;
    const p = MODES[m], t = ctx.currentTime, k = hard ? .01 : 1.1;
    padGain.gain.setTargetAtTime(p.pad, t, k);
    arpGain.gain.setTargetAtTime(p.arp, t, k);
    percGain.gain.setTargetAtTime(p.perc, t, k);
    stepDur = p.stepDur; density = p.density;
  }
  function start(){
    if (running) return;
    running = true;
    ctx = AudioSys.getCtx();
    out = ctx.createGain(); out.gain.value = muted ? 0 : 1; out.connect(ctx.destination);
    // pad: two detuned saws under a slowly breathing lowpass
    padGain = ctx.createGain(); padGain.gain.value = 0;
    padFilter = ctx.createBiquadFilter();
    padFilter.type = 'lowpass'; padFilter.frequency.value = 380; padFilter.Q.value = .9;
    [0.994, 1.006].forEach(dt => {
      const o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = ROOT * dt;
      o.connect(padFilter); o.start();
    });
    const lfo = ctx.createOscillator(); lfo.frequency.value = .05;
    const lg = ctx.createGain(); lg.gain.value = 170;
    lfo.connect(lg); lg.connect(padFilter.frequency); lfo.start();
    padFilter.connect(padGain); padGain.connect(out);
    // echo bus for the motif plucks
    delay = ctx.createDelay(1); delay.delayTime.value = .34;
    const fb = ctx.createGain(); fb.gain.value = .42;
    delay.connect(fb); fb.connect(delay);
    arpGain = ctx.createGain(); arpGain.gain.value = 0;
    delay.connect(arpGain); arpGain.connect(out);
    percGain = ctx.createGain(); percGain.gain.value = 0; percGain.connect(out);
    applyMode('calm', true);
    tick();
  }
  function pluck(t){
    const f = ROOT * 2 * Math.pow(2, SCALE[Math.floor(Math.random()*SCALE.length)] / 12);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(.5, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + .55);
    o.connect(g); g.connect(delay); g.connect(arpGain);
    o.start(t); o.stop(t + .6);
  }
  function thump(t, f0, f1, dur, peak){
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(percGain);
    o.start(t); o.stop(t + dur + .05);
  }
  function tickNoise(t){
    const len = Math.ceil(ctx.sampleRate * .05);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter();
    flt.type = 'highpass'; flt.frequency.value = 4200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.5, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + .05);
    src.connect(flt); flt.connect(g); g.connect(percGain);
    src.start(t); src.stop(t + .08);
  }
  function tick(){
    if (!running) return;
    const t = ctx.currentTime;
    if (Math.random() < density || step % 8 === 0) pluck(t);
    if (step % 8 === 0){                       // sub-bass pulse each bar
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = ROOT / 2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(.09, t + .3);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 1.8);
    }
    if (mode !== 'calm'){
      if (step % 2 === 0) tickNoise(t);
      if (step % 4 === 0) thump(t, 92, 40, .17, .8);
      if (mode === 'alarm' && step % 8 === 4) thump(t, 140, 60, .2, .6);
    }
    step++;
    timer = setTimeout(tick, stepDur * 1000);
  }
  return {
    start,
    setMode(m){ if (running && m !== mode) applyMode(m); },
    stop(){
      if (!running) return;
      out.gain.setTargetAtTime(0, ctx.currentTime, .6);
      setTimeout(() => { running = false; clearTimeout(timer); }, 2500);
    },
    toggleMute(){
      muted = !muted;
      if (out) out.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, .05);
    },
  };
})();

/* ============================================================
   Cinematic post-processing: bloom, FXAA, chromatic aberration on
   hits, filmic color grade, vignette, grain.
   Loaded dynamically; if the addons CDN fails or the quality tier is
   low, the game renders directly (CSS vignette stands in).
   ============================================================ */
const postFX = { enabled:false, loaded:false };
const FX = { ca:0, dmg:0, low:0, kick:0 };   // live feedback values fed to the grade shader
(async () => {
  try {
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass }     = await import('three/addons/postprocessing/RenderPass.js');
    const { UnrealBloomPass }= await import('three/addons/postprocessing/UnrealBloomPass.js');
    const { ShaderPass }     = await import('three/addons/postprocessing/ShaderPass.js');
    const { OutputPass }     = await import('three/addons/postprocessing/OutputPass.js');
    const { FXAAShader }     = await import('three/addons/shaders/FXAAShader.js');
    const G_ = CH.palette.grade || { sh:[.90,.98,1.08], hi:[1.10,1.02,.90] };
    const composer = new EffectComposer(renderer);
    const rp = new RenderPass(scene, camera);
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), .6, .45, .72);
    const fxaa = new ShaderPass(FXAAShader);
    const grade = new ShaderPass({
      uniforms: {
        tDiffuse:{value:null}, uTime:{value:0}, uCA:{value:0}, uDmg:{value:0}, uLow:{value:0},
        uShadow:{value:new THREE.Vector3(...G_.sh)}, uHigh:{value:new THREE.Vector3(...G_.hi)},
      },
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uTime, uCA, uDmg, uLow;
        uniform vec3 uShadow, uHigh; varying vec2 vUv;
        float rnd(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233)))*43758.5453); }
        void main(){
          vec2 c = vUv - .5;
          float r2 = dot(c, c);
          vec2 off = c * (uCA + r2 * .0045);                       // edge-weighted chromatic aberration
          vec3 col = vec3(texture2D(tDiffuse, vUv + off).r,
                          texture2D(tDiffuse, vUv).g,
                          texture2D(tDiffuse, vUv - off).b);
          float l = dot(col, vec3(.2126,.7152,.0722));
          col *= mix(uShadow, uHigh, smoothstep(.08, .75, l));    // split toning: cold shadows, warm highlights
          col = (col - .5) * 1.10 + .5;                           // contrast
          col = max(col, 0.);
          float sat = 1.06 - uLow * .75;
          col = mix(vec3(dot(col, vec3(.2126,.7152,.0722))), col, sat);
          col = mix(col, col * vec3(1.35,.35,.35), uDmg * .55);   // hit tint
          col *= 1.0 - smoothstep(.30, .95, length(c) * 1.28) * (.55 + uLow * .25 + uDmg * .3);   // vignette
          col += (rnd(vUv*vec2(1287.,731.) + mod(uTime,9.)) - .5) * .045;     // film grain
          gl_FragColor = vec4(col, 1.);
        }`,
    });
    composer.addPass(rp); composer.addPass(bloom); composer.addPass(new OutputPass());
    composer.addPass(fxaa); composer.addPass(grade);
    Object.assign(postFX, { composer, renderPass:rp, grade, bloom, fxaa, loaded:true });
    if (typeof applyQuality === 'function') applyQuality(Q.level);
  } catch (e) { /* addons unavailable: plain rendering */ }
})();

/* ============================================================
   GLB hero models (author-generated). Loaded async; the code-built
   models remain as fallbacks if a file or the loader fails.
   ============================================================ */
const MODELS = {};
const modelsReady = (async () => {
  try {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const loader = new GLTFLoader();
    const defs = [
      ['crawler', 'models/crawler.glb', .80, -0.50,  0,     { eye:[0,.06,.42] }],
      ['sentry',  'models/sentry.glb',  .90,  0,     0,     { eye:[0,.02,.45], muzzle:[0,-.30,.42] }],
      ['warden',  'models/warden.glb', 1.30, -0.643, -0.104,{ eye:[0,.14,.66], muzzle:[0,-.30,.60] }],
      ['rifle',   'models/rifle.glb',  1.08,  0,     0,     {}],
      ['pod',     'models/pod.glb',    1.25,  0,     -0.024,{}],
    ];
    await Promise.all(defs.map(([kind, url, k, oy, oz, pts]) => new Promise(res => {
      loader.load(url, g => {
        const inner = g.scene;
        // keep the authored PBR materials; push them toward cold steel and recolour
        // the green emitters to this chapter's machine light
        const tinted = new Map();
        inner.traverse(o => {
          if (o.isMesh && o.material){
            if (!tinted.has(o.material)){
              const m = o.material.clone(), nm = m.name;
              if (nm === 'green_glow'){
                m.color.set(MGLOW).multiplyScalar(.25); m.emissive.set(MGLOW); m.emissiveIntensity = 1.7;
              } else if (nm === 'screen'){
                m.color.set(MGLOW).multiplyScalar(.2); m.emissive.set(MGLOW); m.emissiveIntensity = 1.8;
              } else if (nm === 'glass'){
                m.transparent = true; m.opacity = .2; m.roughness = .05; m.metalness = 0; m.depthWrite = false; m.envMapIntensity = 1.8;
              } else if (nm === 'subject'){
                m.roughness = .85; m.color.multiplyScalar(.5);
              } else {
                m.color.multiply(new THREE.Color(.62,.68,.78));
                m.roughness = Math.min(.7, Math.max(.5, m.roughness + .05)); m.metalness = .8; m.envMapIntensity = 1.3;
              }
              patchSurface(m, { floorAO:.6, ceilAO:0, aoH:1.0, noise:false });
              tinted.set(o.material, m);
            }
            o.material = tinted.get(o.material);
          }
        });
        const wrap = new THREE.Group();
        if (kind === 'rifle'){
          inner.position.set(-0.131, -0.031, 0);   // recenter, then aim barrel down -Z
          wrap.rotation.y = -Math.PI/2;
        }
        wrap.add(inner);
        wrap.scale.setScalar(k);
        const outer = new THREE.Group();
        wrap.position.set(0, oy, oz);
        outer.add(wrap);
        MODELS[kind] = { template: outer, ...pts };
        res();
      }, undefined, () => res());
    })));
  } catch (e) { /* loader unavailable, procedural models remain */ }
})();

const GFX = { dust:null, shafts:[], glows:[] };
function applyQuality(level){
  level = QLEVELS.includes(level) ? level : 'low';
  Q.level = level;
  const p = Q.p = QP[level];
  const w = window.innerWidth, h = window.innerHeight;
  const pr = Math.min(window.devicePixelRatio, p.pr * Q.scale);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  const spot = !!p.shadows;
  hemi.intensity = (CH.palette.hemiI || .75) * (spot ? 1 : 1.5);
  renderer.toneMappingExposure = (CH.palette.exposure || 1.15) * (p.post || spot ? 1 : 1.12);
  flash.visible = spot; flash.castShadow = spot;
  lamp.intensity = spot ? 14 : 42;
  accent.visible = !!p.accent;
  if (GFX.dust) GFX.dust.geometry.setDrawRange(0, p.dust);
  GFX.shafts.forEach((m,i) => { m.visible = i < p.shafts; });
  postFX.enabled = postFX.loaded && !!p.post;
  if (postFX.loaded){
    postFX.composer.setPixelRatio(pr);
    postFX.composer.setSize(w, h);
    postFX.bloom.strength = p.bloom;
    postFX.fxaa.enabled = !!p.fxaa;
    postFX.fxaa.material.uniforms.resolution.value.set(1/(w*pr), 1/(h*pr));
  }
  document.body.classList.toggle('postfx', postFX.enabled);
  G._fpsT = 0; G._fpsN = 0; G._fpsSkip = 1; G._fpsGood = 0; G._fpsBad = 0;
  if (typeof refreshGfxButton === 'function') refreshGfxButton();
}

// Runtime governor: samples fps in 2.5s windows while playing.
// Two bad windows in a row step quality down (and remember it for this device).
// A phone that sits at 57+ fps for three windows is promoted one tier, once.
function governor(nowT){
  if (!G._fpsT){ G._fpsT = nowT; G._fpsN = 0; return; }
  G._fpsN++;
  const span = nowT - G._fpsT;
  if (span < 2500) return;
  const fps = G._fpsN / (span / 1000);
  G._fpsT = nowT; G._fpsN = 0;
  if (span > 6000) return;               // tab was hidden or a long hitch; ignore
  if (G._fpsSkip > 0){ G._fpsSkip--; return; }
  Q.fps = fps;
  const floorFps = IS_TOUCH ? 30 : 42;
  if (fps < floorFps){
    G._fpsGood = 0;
    if (++G._fpsBad < 2) return;
    G._fpsBad = 0;
    Q.noUp = true;
    const i = QLEVELS.indexOf(Q.level);
    if (i > 0){
      const nl = QLEVELS[i-1];
      try { localStorage.setItem('latm_qcap', nl); } catch(e){}
      applyQuality(nl);
    } else if (Q.scale > .62){
      Q.scale = Math.max(.62, Q.scale * .85);   // last resort: render fewer pixels
      applyQuality('low');
    }
  } else if (fps > 56 && !Q.noUp){
    G._fpsBad = 0;
    const cap = Q.phone ? 'med' : 'high';
    if (++G._fpsGood >= 3 && QLEVELS.indexOf(Q.level) < QLEVELS.indexOf(cap)){
      Q.noUp = true;   // one promotion only: no flip-flopping
      applyQuality(QLEVELS[QLEVELS.indexOf(Q.level) + 1]);
    }
  } else { G._fpsBad = 0; }
}

function renderFrame(sc, cm){
  if (postFX.enabled){
    postFX.renderPass.scene = sc; postFX.renderPass.camera = cm;
    const u = postFX.grade.uniforms;
    u.uTime.value = G.time; u.uCA.value = FX.ca; u.uDmg.value = FX.dmg; u.uLow.value = FX.low;
    postFX.composer.render();
  } else {
    renderer.render(sc, cm);
  }
}

function layoutViewmodel(){
  // portrait phones see a narrow horizontal field, so pull the rifle toward the centre line
  const portrait = window.innerWidth / window.innerHeight < .9;
  VM.base.set(portrait ? .075 : .2, portrait ? -.2 : -.23, portrait ? -.46 : -.5);
  viewRifle.scale.setScalar(portrait ? .78 : 1);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  layoutViewmodel();
  applyQuality(Q.level);
});

const Cinematic = (() => {

      w.scale.set(.8, 3+Math.random()*7, .8);

      mono.add(w);
    }
    mono.position.set(105, 0, -42);
    mono.lookAt(0,0,0); mono.rotateY(Math.PI);
    cScene.add(mono);
    // smoke streamers
    const smokeTex = cinTex((g,s)=>{
      g.clearRect(0,0,s,s);
      for (let i=0;i<9;i++){
        const x=Math.random()*s, y=s*.3+Math.random()*s*.4, r=s*(.12+Math.random()*.16);
        const d=g.createRadialGradient(x,y,1,x,y,r);
        d.addColorStop(0,'rgba(28,16,12,.55)'); d.addColorStop(1,'rgba(28,16,12,0)');
        g.fillStyle=d; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
      }
    });
    const smokeMat = new THREE.MeshBasicMaterial({ map:smokeTex, transparent:true,
      opacity:.75, depthWrite:false, side:THREE.DoubleSide, fog:false });
    for (let i=0;i<8;i++){
      const p = new THREE.Mesh(new THREE.PlaneGeometry(90, 20), smokeMat);
      p.position.set(-120+Math.random()*240, 26+Math.random()*34, -140+Math.random()*160);
      p.rotation.x = -.15;
      cScene.add(p); smokes.push(p);
    }
    // falling ash
    {
      const n=420, pos=new Float32Array(n*3);
      for (let i=0;i<n;i++){
        pos[i*3]=(Math.random()-.5)*90; pos[i*3+1]=Math.random()*45; pos[i*3+2]=(Math.random()-.5)*90;
      }
      const g2 = new THREE.BufferGeometry();
      g2.setAttribute('position', new THREE.BufferAttribute(pos,3));
      ash = new THREE.Points(g2, new THREE.PointsMaterial({ color:0x9a8878, size:.14,
        transparent:true, opacity:.6, depthWrite:false }));
      cScene.add(ash);
    }
    // patrol drones with searchlight beams
    const beamMat = new THREE.MeshBasicMaterial({ color:0xff3322, transparent:true,
      opacity:.12, blending:THREE.AdditiveBlending, depthWrite:false, fog:false });
    const bodyMat = new THREE.MeshStandardMaterial({ color:0x14100c, roughness:.5, metalness:.6 });
    function mkDrone(){
      const g3 = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8), bodyMat);
      body.scale.set(1.4,.7,1.4);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 6),
        new THREE.MeshBasicMaterial({ color:0xff3322 }));
      eye.position.y = -.5;
      const beam = new THREE.Mesh(new THREE.ConeGeometry(4.2, 26, 12, 1, true), beamMat);
      beam.position.y = -13.5;
      g3.add(body, eye, beam);
      g3.userData.beam = beam;
      cScene.add(g3);
      return g3;
    }
    for (let i=0;i<3;i++){ patrols.push(mkDrone()); }
    hunter = mkDrone();
    hunter.visible = false;
  }
  function start(done){
    onDone = done; t = 0; subIdx = -1; flashed = false; alerted = false;
    build();
    active = true;
    el.fade.style.transition = 'none';
    el.fade.style.background = '#000';
    el.fade.style.opacity = 1;
    AudioSys.windStart();
    setTimeout(()=>{ el.skipBtn.style.opacity = .7; }, 2500);
  }
  function teardown(){
    active = false;
    AudioSys.windStop();
    cScene = null; cCam = null; smokes = []; patrols = []; ash = null; hunter = null;
  }
  function update(dt){
    if (!active) return;
    t += dt;
    // subtitles
    const next = SUBS.findIndex(([st]) => t >= st && t < st + 5);
    if (next !== subIdx){
      subIdx = next;
      if (next >= 0){ el.introText.textContent = SUBS[next][1]; el.introText.style.opacity = 1; }
      else el.introText.style.opacity = 0;
    }
    // eyelids: slow open with one heavy re-blink
    let fade = Math.max(0, .95 - t*.30);
    if (t > 1.7 && t < 2.3) fade = Math.max(fade, .8*(1 - Math.abs((t-2)/.3)));
    // final flash: the searchlight hits, then black
    if (t > 33.6){
      el.fade.style.background = t > 35.6 ? '#000' : '#fff';
      fade = Math.min(1, (t-33.6)/1.6);
      if (t > 35.6) fade = 1;
    }
    el.fade.style.opacity = fade;
    // camera timeline
    const yawAB = .05*Math.sin(t*.3);
    let pitch, yaw = yawAB, y = .55;
    if (t < 6){ pitch = 1.28 + Math.sin(t*.55)*.03; }
    else if (t < 13){ const k = smooth((t-6)/7);  pitch = 1.28 - k*1.16; y = .55 + k*1.05; }
    else if (t < 19){ const k = smooth((t-13)/6); pitch = .12 - k*.06;  y = 1.6; yaw = .95*k; }
    else if (t < 25){ const k = smooth((t-19)/6); pitch = .06 + k*.06;  y = 1.6; yaw = .95 - 1.5*k; }
    else if (t < 31){ const k = smooth((t-25)/6); pitch = .12 + k*.10;  y = 1.6; yaw = -.55 - .7*k; }
    else            { const k = smooth((t-31)/4); pitch = .22 - k*.10;  y = 1.6; yaw = -1.25 + .35*k; }
    cCam.position.set(0, y, 0);
    cCam.rotation.y = yaw; cCam.rotation.x = pitch;
    // world motion
    smokes.forEach((p,i)=>{ p.position.x += dt*(1.1+i*.13); if (p.position.x > 140) p.position.x = -140; });
    if (ash){
      const a = ash.geometry.attributes.position;
      for (let i=0;i<a.count;i++){
        a.array[i*3+1] -= dt*(.5 + (i%5)*.22);
        if (a.array[i*3+1] < 0) a.array[i*3+1] = 45;
      }
      a.needsUpdate = true;
    }
    patrols.forEach((d,i)=>{
      const k = ((t*.032 + i*.34) % 1.3) - .5;
      d.position.set(-k*150, 30+Math.sin(t*.8+i)*1.6, -55-i*16);
      d.userData.beam.rotation.z = Math.sin(t*.6+i*2)*.25;
    });
    if (t > 29){
      hunter.visible = true;
      const k = smooth((t-29)/6);
      hunter.position.set(-60+(k*58), 30-(k*17), -46+(k*39));
      hunter.userData.beam.material.opacity = .12 + k*.3;
      hunter.userData.beam.scale.setScalar(1 - k*.5);
      hunter.lookAt(cCam.position);
      if (!alerted && t > 31.2){ alerted = true; AudioSys.alert(); }
      if (!flashed && t > 33.8){ flashed = true; AudioSys.hurt(); AudioSys.alert(); }
    }
    renderFrame(cScene, cCam);
    if (t > 36.6) finish();
  }
  function finish(){
    teardown();
    el.introText.style.opacity = 0;
    if (onDone) onDone();
  }
  return { start, update, skip: teardown, isActive: () => active };
})();

/* ============================================================
   Level: 5 rooms (start, 3 segments, core) along -Z
   ============================================================ */
const WALL_H = 4, DOOR_HALF = 1.6;
const ROOMS = CH.rooms;
const PILLARS = CH.pillars;

/* ---- procedural PBR texture sets (canvas, zero image assets) ----
   Each set is albedo + tangent normal (derived from a painted height map) +
   packed ORM (G = roughness, B = metalness) + optional emissive.            */
function makeTex(draw, size=512){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const ANISO = Math.min(renderer.capabilities.getMaxAnisotropy(), Q.level === 'high' ? 8 : 3);
const SEED = [...CH.id].reduce((a,c) => a*31 + c.charCodeAt(0), 7);
function rngOf(seed){
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const gray = v => `rgb(${v|0},${v|0},${v|0})`;
const ormc = (r, m) => `rgb(0,${(r*255)|0},${(m*255)|0})`;
function canvasOf(s){ const c = document.createElement('canvas'); c.width = c.height = s; return c; }
function toTex(c, srgb){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function heightToNormal(hc, strength){
  const s = hc.width, src = hc.getContext('2d').getImageData(0,0,s,s).data;
  const out = canvasOf(s), og = out.getContext('2d'), img = og.createImageData(s,s), d = img.data;
  const Hh = (x,y) => src[(((y+s)%s)*s + ((x+s)%s))*4] / 255;
  for (let y=0;y<s;y++) for (let x=0;x<s;x++){
    const dx = (Hh(x+1,y) - Hh(x-1,y)) * strength, dy = (Hh(x,y+1) - Hh(x,y-1)) * strength;
    const l = Math.hypot(dx, dy, 1), i = (y*s + x)*4;
    d[i]   = (-dx/l*.5 + .5)*255;
    d[i+1] = ( dy/l*.5 + .5)*255;
    d[i+2] = ( 1/l*.5 + .5)*255;
    d[i+3] = 255;
  }
  og.putImageData(img,0,0);
  return out;
}
// paint(L) is called in a fixed 512x512 logical space on four layers:
//   L.a albedo, L.h height (gray), L.o roughness/metal, L.e emissive
function makePBR(paint, seedOff, opts={}){
  const s = TEXN, R = rngOf(SEED + seedOff);
  const A = canvasOf(s), Hc = canvasOf(s), O = canvasOf(s), E = canvasOf(s);
  const L = { a:A.getContext('2d'), h:Hc.getContext('2d'), o:O.getContext('2d'), e:E.getContext('2d'), R, S:512 };
  [L.a, L.h, L.o, L.e].forEach(c => c.scale(s/512, s/512));
  L.h.fillStyle = gray(128); L.h.fillRect(0,0,512,512);
  L.o.fillStyle = ormc(.7,.5); L.o.fillRect(0,0,512,512);
  L.e.fillStyle = '#000'; L.e.fillRect(0,0,512,512);
  paint(L);
  const set = { map:toTex(A,true), normal:toTex(heightToNormal(Hc, opts.nstr || 3.2), false), orm:toTex(O,false) };
  if (opts.emissive) set.emissive = toTex(E,true);
  return set;
}
const hexCol = c => '#' + new THREE.Color(c).getHexString();
const STRIP_CSS = hexCol(CH.palette.strip);

// shared painting helpers
function bolt(L, x, y, r=4){
  L.a.fillStyle = 'rgba(15,17,20,.8)'; L.a.beginPath(); L.a.arc(x,y,r+1.5,0,7); L.a.fill();
  L.a.fillStyle = 'rgba(200,210,220,.55)'; L.a.beginPath(); L.a.arc(x-.6,y-.6,r*.7,0,7); L.a.fill();
  L.h.fillStyle = gray(215); L.h.beginPath(); L.h.arc(x,y,r,0,7); L.h.fill();

}
function groove(L, x, y, w, h){
  L.h.strokeStyle = gray(25); L.h.lineWidth = 5; L.h.strokeRect(x,y,w,h);
  L.h.strokeStyle = gray(205); L.h.lineWidth = 2; L.h.strokeRect(x+4,y+4,w-8,h-8);

function weather(L, n, rustPal){
  const R = L.R;
  for (let i=0;i<n*2;i++){                                  // vertical rust / drip streaks
    const x = R()*512, w = R()*7+2, y0 = R()*340, len = 90 + R()*230;
    const g = L.a.createLinearGradient(0,y0,0,y0+len);

    const x = R()*512, y = R()*512, r = 14 + R()*46;
    let g = L.a.createRadialGradient(x,y,1,x,y,r); g.addColorStop(0,'rgba(0,0,0,.34)'); g.addColorStop(1,'rgba(0,0,0,0)');
    L.a.fillStyle = g; L.a.fillRect(x-r,y-r,r*2,r*2);
    g = L.o.createRadialGradient(x,y,1,x,y,r); g.addColorStop(0,'rgba(0,255,0,.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
    L.o.fillStyle = g; L.o.fillRect(x-r,y-r,r*2,r*2);
  }
  for (let i=0;i<n*3;i++){                                  // bright scratches on bare metal
    const x = R()*512, y = R()*512, a = R()*6.28, l = 6 + R()*34;
    const x2 = x + Math.cos(a)*l, y2 = y + Math.sin(a)*l;
    L.a.strokeStyle = 'rgba(210,222,235,.20)'; L.a.lineWidth = 1; L.a.beginPath(); L.a.moveTo(x,y); L.a.lineTo(x2,y2); L.a.stroke();
    L.h.strokeStyle = gray(70); L.h.lineWidth = 1.2; L.h.beginPath(); L.h.moveTo(x,y); L.h.lineTo(x2,y2); L.h.stroke();
    L.o.strokeStyle = ormc(.22,1); L.o.lineWidth = 1.4; L.o.beginPath(); L.o.moveTo(x,y); L.o.lineTo(x2,y2); L.o.stroke();
  }
  for (let i=0;i<n*14;i++){                                 // pitting
    const x = R()*512, y = R()*512;
    L.a.fillStyle = 'rgba(0,0,0,.22)'; L.a.fillRect(x,y,1+R()*2.5,1+R()*2.5);
    L.h.fillStyle = gray(70+R()*40); L.h.fillRect(x,y,1+R()*2,1+R()*2);

}
function hazard(L, x, y, w, h){
  L.a.save(); L.a.beginPath(); L.a.rect(x,y,w,h); L.a.clip();

/* world-space shader patch: baked-style ambient occlusion (dark at floor and ceiling
   joins), low-frequency albedo mottling that hides texture tiling, and optional wet
   floor roughness variation. Costs a few ALU ops, no extra textures. */
function patchSurface(m, o = {}){
  const fAO = o.floorAO ?? .5, cAO = o.ceilAO ?? .4, aoH = o.aoH ?? 1.1;
  const key = `srf_${fAO}_${cAO}_${aoH}_${o.wet?1:0}_${o.noise===false?0:1}`;
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vWP;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i+vec2(1.,0.)), f.x), mix(h21(i+vec2(0.,1.)), h21(i+vec2(1.,1.)), f.x), f.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
${o.noise === false ? '' : 'float nz = vn(vWP.xz*.45 + vWP.y*.9)*.6 + vn(vWP.xz*1.7 + vWP.y*2.3)*.4; diffuseColor.rgb *= mix(.72, 1.14, nz);'}
float aoF = mix(${(1-fAO).toFixed(2)}, 1., smoothstep(0., ${aoH.toFixed(2)}, vWP.y));
float aoC = mix(${(1-cAO).toFixed(2)}, 1., smoothstep(0., .9, ${WALL_H.toFixed(1)} - vWP.y));
diffuseColor.rgb *= aoF * aoC;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
${o.wet ? 'float wet = smoothstep(.40,.62, vn(vWP.xz*.28+3.1)*.65 + vn(vWP.xz*.9)*.35); roughnessFactor = mix(roughnessFactor, roughnessFactor*.3, wet*.85); diffuseColor.rgb *= mix(1.,.72,wet);' : ''}`);
  };
  m.customProgramCacheKey = () => key;
  return m;
}
const EMISSIVE_MATS = [];
function surfMat(set, rx, ry, extra = {}, patch = {}){
  const cl = t => { if (!t) return null; const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
  const orm = cl(set.orm);
  const m = new THREE.MeshStandardMaterial({
    map: cl(set.map), normalMap: cl(set.normal), roughnessMap: orm, metalnessMap: orm,
    roughness: 1, metalness: 1, normalScale: new THREE.Vector2(1, 1), envMapIntensity: .9,
    emissiveMap: set.emissive ? cl(set.emissive) : null,
    emissive: set.emissive ? new THREE.Color(CH.palette.strip) : new THREE.Color(0x000000),
    emissiveIntensity: 1.1, ...extra });
  if (set.emissive) EMISSIVE_MATS.push(m);
  return patchSurface(m, patch);
}

const VMLIGHT = { value:.03 };   // direct light reaching the viewmodel (raised by the muzzle flash)
function dimViewmodel(group){
  // the view-model sits half a metre from the headlamp, so its lit materials are
  // darkened and de-glossed or physically-correct falloff blows them out white
  const seen = new Map();
  group.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = false; o.receiveShadow = false; o.frustumCulled = false;
    if (!seen.has(o.material)){
      const m = o.material.clone();
      if (m.isMeshStandardMaterial){
        const glow = m.emissiveIntensity > 0 && m.emissive.getHex() > 0;
        if (glow) m.emissiveIntensity = Math.min(m.emissiveIntensity, .55);
        else { m.color.multiplyScalar(.5); m.roughness = Math.max(.42, m.roughness); m.metalness = Math.min(.75, m.metalness); m.envMapIntensity = .9; }
        m.onBeforeCompile = sh => {
          sh.uniforms.uVML = VMLIGHT;
          sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uVML;')
            .replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\nreflectedLight.directDiffuse *= uVML; reflectedLight.directSpecular *= uVML;');
        };
        m.customProgramCacheKey = () => 'vm';
      }
      seen.set(o.material, m);
    }
    o.material = seen.get(o.material);
  });
}

function makeDrone(kind, x, z, segment){
  const isCrawler = kind === 'crawler';
  const K = KINDS[kind];
  const eyeMat = new THREE.MeshBasicMaterial({ color: K.idleEye || EYE_GREEN });
  const M = MODELS[kind];
  let built, flashMats = [];
  if (M){
    const g = M.template.clone();
    const anim = { glb: true };
    // per-drone material instances so hit flashes stay local to one machine
    const inst = new Map(); flashMats = [];
    g.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true;
      let m = inst.get(o.material);
      if (!m){
        m = o.material.clone();
        m.onBeforeCompile = o.material.onBeforeCompile; m.customProgramCacheKey = o.material.customProgramCacheKey;
        m.userData.e0 = m.emissive.clone(); m.userData.i0 = m.emissiveIntensity;
        inst.set(o.material, m); flashMats.push(m);
      }
      o.material = m;
    });
    const eye = new THREE.Mesh(eyeGeoC, eyeMat);
    eye.position.set(...M.eye);
    g.add(eye);
    anim.haloMat = new THREE.SpriteMaterial({ map:SOFT_TEX, color:K.idleEye || EYE_GREEN, transparent:true,
      opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false });
    const halo = new THREE.Sprite(anim.haloMat);
    halo.scale.setScalar(isCrawler ? .5 : .6); halo.position.set(...M.eye); g.add(halo);
    if (M.muzzle){
      anim.muzzle = new THREE.Object3D();
      anim.muzzle.position.set(...M.muzzle);
      g.add(anim.muzzle);
      anim.recoil = 0;
    }
    built = { g, anim };
  } else {
    built = isCrawler ? buildCrawler(eyeMat) : buildSentry(eyeMat);
  }
  const mesh = built.g;
  // blob shadow, child of the group but pinned to the floor each frame
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI/2;
  shadow.scale.setScalar(isCrawler ? 1.2 : 1.4);
  mesh.add(shadow);
  if (!M && K.scale && K.scale !== 1) mesh.scale.setScalar(K.scale);
  const d = {
    id: droneSeq++, kind, segment, mesh, eyeMat, anim: built.anim, shadow, fm: flashMats, flash: 0,
    baseScale: M ? 1 : (K.scale || 1), idleEye: K.idleEye || EYE_GREEN,
    home: new THREE.Vector3(x, K.homeY, z),
    hp: K.hp, maxHp: K.hp,
    state: 'idle',            // idle > alert > attack
    stateT: 0, losT: Math.random()*.15,
    meleeCd: 0, chargeT: 0, patrolDir: 1,
    alive: true, spawned: false, deathT: 0,
  };
  mesh.position.copy(d.home);
  drones.push(d);
  return d;
}

  // (re)create the initial drones of a segment; used at load + on respawn
  for (let i = drones.length-1; i >= 0; i--){
    if (drones[i].segment === seg){
      scene.remove(drones[i].mesh);
      drones.splice(i,1);

    const d = makeDrone(k,x,z,s);
    d.spawned = true; scene.add(d.mesh);
  });
}

/* ============================================================
   Collision: circle vs AABB list
   ============================================================ */
function collide(pos, r){
  for (const c of colliders){
    if (c.door && !c.active) continue;
    const cx = Math.max(c.x1, Math.min(pos.x, c.x2));
    const cz = Math.max(c.z1, Math.min(pos.z, c.z2));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 < r*r){
      const d = Math.sqrt(d2) || 0.0001;
      const push = (r - d) / d;
      pos.x += dx * push; pos.z += dz * push;
    }
  }
}

/* ============================================================
   Line of sight (2D grid vs AABBs, cheap, no raycaster allocs)
   ============================================================ */
function losBlocked(ax, az, bx, bz){
  for (const c of colliders){
    if (c.door && !c.active) continue;
    if (segIntersectsAABB(ax, az, bx, bz, c)) return true;
  }
  return false;
}
function segIntersectsAABB(x0,z0,x1,z1,c){
  // slab method
  const dx = x1-x0, dz = z1-z0;
  let tmin = 0, tmax = 1;
  if (Math.abs(dx) < 1e-9){ if (x0 < c.x1 || x0 > c.x2) return false; }
  else {
    let t1 = (c.x1-x0)/dx, t2 = (c.x2-x0)/dx;
    if (t1 > t2) [t1,t2] = [t2,t1];
    tmin = Math.max(tmin,t1); tmax = Math.min(tmax,t2);
    if (tmin > tmax) return false;
  }
  if (Math.abs(dz) < 1e-9){ if (z0 < c.z1 || z0 > c.z2) return false; }
  else {
    let t1 = (c.z1-z0)/dz, t2 = (c.z2-z0)/dz;
    if (t1 > t2) [t1,t2] = [t2,t1];
    tmin = Math.max(tmin,t1); tmax = Math.min(tmax,t2);
    if (tmin > tmax) return false;
  }
  return true;
}
